# TEMPORARY experiment (rev 3) — removed after use. Learns where and how SumatraPDF
# records the page a document was closed on.
name: Sumatra probe
on:
  push:
    branches: [review-windows]
    paths: ['.github/workflows/sumatra-probe.yml']
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - run: choco install sumatrapdf.install -y --no-progress
      - run: pip install fpdf2
      - shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter SumatraPDF.exe -Path "$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:LOCALAPPDATA" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          "EXE: $exe"
          New-Item -ItemType Directory -Force "C:\probe dir" | Out-Null
          python -c "from fpdf import FPDF; p=FPDF(); [ (p.add_page(), p.set_font('helvetica',size=40), p.cell(text=f'Page {i}')) for i in (1,2,3)]; p.output(r'C:\probe dir\Three Pages.pdf')"
          function Show-State($label) {
            "=== $label"
            Get-Process SumatraPDF -ErrorAction SilentlyContinue | ForEach-Object { "  running pid=$($_.Id) title='$($_.MainWindowTitle)'" }
            Get-Content "$env:LOCALAPPDATA\SumatraPDF\SumatraPDF-settings.txt" -ErrorAction SilentlyContinue | Select-String 'FilePath|PageNo' | ForEach-Object { "  $($_.Line.Trim())" }
          }
          Start-Process $exe -ArgumentList '-page','2','"C:\probe dir\Three Pages.pdf"'
          Start-Sleep 15
          Show-State "after opening with -page 2 (15s)"
          taskkill /IM SumatraPDF.exe | Out-String
          Start-Sleep 5
          Show-State "after taskkill (graceful close)"
          Start-Process $exe -ArgumentList '-reuse-instance','-page','3','"C:\probe dir\Three Pages.pdf"'
          Start-Sleep 15
          Show-State "after reopening with -reuse-instance -page 3"
          taskkill /IM SumatraPDF.exe | Out-String
          Start-Sleep 5
          Show-State "after second close"
          Stop-Process -Name SumatraPDF -Force -ErrorAction SilentlyContinue
          "--- settings files"
          Get-ChildItem -Recurse -Filter SumatraPDF-settings.txt -Path "$env:LOCALAPPDATA","$env:APPDATA",(Split-Path $exe) -ErrorAction SilentlyContinue | ForEach-Object {
            "FILE: $($_.FullName)"
            Get-Content $_.FullName | Select-String -Pattern 'FileStates|SessionData|FilePath|PageNo|ReuseInstance|UseTabs|RememberStatePerDocument' | ForEach-Object { "  $($_.Line)" }
          }
