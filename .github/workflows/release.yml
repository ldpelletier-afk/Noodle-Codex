# Builds Codex for macOS (universal: Apple Silicon + Intel) and Windows, and
# attaches the installers to a draft GitHub Release. Runs when a version tag
# is pushed (e.g. `git tag v0.3.0 && git push origin v0.3.0`), or by hand from
# the Actions tab. Publish the draft from the Releases page once it looks right.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # One job creates (or finds) the draft release up front, so the parallel
  # builds below upload into the same release instead of racing to create it.
  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Codex v$VERSION" \
              -f body="Runs on macOS (Apple Silicon and Intel) and Windows 10/11. See the README for first-launch steps." \
              -F draft=true --jq .id)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
